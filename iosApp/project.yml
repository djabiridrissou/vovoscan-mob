# Xcode project generated by XcodeGen (brew install xcodegen; cd iosApp; xcodegen).
# The .xcodeproj is not tracked: project.yml is the source of truth.
name: Vovoscan
options:
  bundleIdPrefix: com.vovoscan
  # 18.4: the first iOS whose AudioToolbox reads Ogg (the API's episode audio is Ogg Opus); the 18.2 simulator answers
  # kAudioFileUnsupportedFileTypeError, 18.4 plays it (iosApp/Tests/Audio). See CLAUDE.md, "iOS audio".
  deploymentTarget:
    iOS: "18.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vovoscan:
    type: application
    platform: iOS
    scheme:
      testTargets: [VovoscanAudioTests]
    sources:
      - Sources
      # Dela Gothic One and Space Grotesk (Regular, Medium, Bold), bundled with their OFL licences.
      - path: Fonts
        buildPhase: resources
      # App icon (any, dark, tinted), the in-app logo (BrandLogo) and the launch screen (LaunchMark on
      # LaunchBackground). Replacing these images is enough to change the brand everywhere.
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: vovoscan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        WEB_BASE_URL: $(WEB_BASE_URL)
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIAppFonts: [DelaGothicOne-Regular.ttf, SpaceGrotesk-Regular.ttf, SpaceGrotesk-Medium.ttf, SpaceGrotesk-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The share sheet's "Save Video" for an episode's MP4 (adds to Photos, never reads it).
        NSPhotoLibraryAddUsageDescription: Saves the episode videos you choose to keep in Photos.
        # Downloads that carry on later (BackgroundDownloads.swift): a processing task (network required) and an app
        # refresh task. The identifiers follow the bundle id (".dev" in Debug).
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).downloads
          - $(PRODUCT_BUNDLE_IDENTIFIER).downloads.refresh
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lsqlite3]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Kotlin targets: iosArm64 and iosSimulatorArm64 only (no Intel simulator).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app.dev
          API_BASE_URL: http://localhost:8000/
          WEB_BASE_URL: http://localhost:3000/
        Release:
          API_BASE_URL: https://vovoscan.yieldgrowth.org/
          WEB_BASE_URL: https://vovoscan.yieldgrowth.org/
    preBuildScripts:
      - name: Build the Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  # The episode audio (Sources/Audio: AVAudioEngine, Ogg Opus) tested offline in the simulator, without the app or the
  # Kotlin framework: xcodebuild test -project Vovoscan.xcodeproj -scheme Vovoscan -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6'
  VovoscanAudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Audio
      - path: Tests/Audio
        excludes: ["*.sh"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.audio-tests
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
