# Xcode project generated by XcodeGen (brew install xcodegen; cd iosApp; xcodegen).
# The .xcodeproj is not tracked: project.yml is the source of truth.
name: Vovoscan
options:
  bundleIdPrefix: com.vovoscan
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vovoscan:
    type: application
    platform: iOS
    sources:
      - Sources
      # Dela Gothic One and Space Grotesk (scripts/fetch-fonts.sh); if missing, the system font is used instead.
      - path: Fonts
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: vovoscan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIAppFonts: [DelaGothicOne-Regular.ttf, SpaceGrotesk.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lsqlite3]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Kotlin targets: iosArm64 and iosSimulatorArm64 only (no Intel simulator).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app.dev
          API_BASE_URL: http://localhost:8000/
        Release:
          API_BASE_URL: https://vovoscan.yieldgrowth.org/
    preBuildScripts:
      - name: Build the Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
