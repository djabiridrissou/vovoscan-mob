# Xcode project generated by XcodeGen (brew install xcodegen; cd iosApp; xcodegen).
# The .xcodeproj is not tracked: project.yml is the source of truth.
name: Vovoscan
options:
  bundleIdPrefix: com.vovoscan
  # 18.4: the first iOS whose AudioToolbox reads Ogg (the API's episode audio is Ogg Opus); the 18.2 simulator answers
  # kAudioFileUnsupportedFileTypeError, 18.4 plays it (iosApp/Tests/Audio). See CLAUDE.md, "iOS audio".
  deploymentTarget:
    iOS: "18.4"
# Firebase Messaging carries the sealed pushes to APNs (docs/NOTIFICATIONS.md). Only the Messaging product is linked;
# it is configured only when the build has its GoogleService-Info.plist (git-ignored), otherwise it stays idle.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Vovoscan:
    type: application
    platform: iOS
    scheme:
      testTargets: [VovoscanAudioTests]
    sources:
      - Sources
      # Dela Gothic One and Space Grotesk (Regular, Medium, Bold), bundled with their OFL licences.
      - path: Fonts
        buildPhase: resources
      # App icon (any, dark, tinted), the in-app logo (BrandLogo) and the launch screen (LaunchMark on
      # LaunchBackground). Replacing these images is enough to change the brand everywhere.
      - Assets.xcassets
      # Firebase's configuration for this app (git-ignored): pushes reach the phone only when it is there.
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - target: VovoscanNotifications
    entitlements:
      path: Vovoscan.entitlements
      properties:
        # APNs; the Keychain group the notification service extension shares (this install's push key).
        aps-environment: development
        keychain-access-groups: [$(AppIdentifierPrefix)com.vovoscan.push]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: vovoscan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        API_BASE_URL: $(API_BASE_URL)
        WEB_BASE_URL: $(WEB_BASE_URL)
        # Reading circle invites (vovoscan://together/CODE) and group links (vovoscan://g/<handle>): the website's
        # /together/CODE and /g/<handle> pages hand over to the app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).together
            CFBundleURLSchemes: [vovoscan]
        UILaunchScreen:
          UIImageName: LaunchMark
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        # PushSeal.swift: the shared Keychain group is <prefix>com.vovoscan.push.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # No method swizzling: AppDelegate hands the APNs token to Firebase itself.
        FirebaseAppDelegateProxyEnabled: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        # ProMotion: the reader's spring and the player run at up to 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIAppFonts: [DelaGothicOne-Regular.ttf, SpaceGrotesk-Regular.ttf, SpaceGrotesk-Medium.ttf, SpaceGrotesk-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation, so Split View, Slide Over and Stage Manager can size the app freely (no
        # UIRequiresFullScreen). The layout follows the window (core/common Adaptive.kt), never the device's name.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The share sheet's "Save Video" for an episode's MP4 (adds to Photos, never reads it).
        NSPhotoLibraryAddUsageDescription: Saves the episode videos you choose to keep in Photos.
        # Downloads that carry on later (BackgroundDownloads.swift): a processing task (network required) and an app
        # refresh task; on iOS 26+, a continued processing task for downloads the user starts (one identifier per
        # request, hence the wildcard; it needs no background mode). The identifiers follow the bundle id (".dev" in Debug).
        UIBackgroundModes: [processing, fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).downloads
          - $(PRODUCT_BUNDLE_IDENTIFIER).downloads.refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).downloads.continued.*
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app
        # iPhone and iPad (a native iPad layout, not the iPhone app scaled up).
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared, -lsqlite3]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Kotlin targets: iosArm64 and iosSimulatorArm64 only (no Intel simulator).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app.dev
          API_BASE_URL: http://localhost:8000/
          WEB_BASE_URL: http://localhost:3000/
        Release:
          API_BASE_URL: https://vovoscan.yieldgrowth.org/
          WEB_BASE_URL: https://vovoscan.yieldgrowth.org/
    preBuildScripts:
      - name: Build the Kotlin Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  # Opens each sealed push on the device and writes it in the app's language (NotificationService/, PushSeal.swift):
  # the server only sends a placeholder alert with mutable-content.
  VovoscanNotifications:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Sources/Push/PushSeal.swift
    entitlements:
      path: VovoscanNotifications.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.vovoscan.push]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: vovoscan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app.notifications
        CODE_SIGN_STYLE: Automatic
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.app.dev.notifications
  # The episode audio (Sources/Audio: AVAudioEngine, Ogg Opus) tested offline in the simulator, without the app or the
  # Kotlin framework: xcodebuild test -project Vovoscan.xcodeproj -scheme Vovoscan -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.6'
  VovoscanAudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Audio
      - path: Tests/Audio
        excludes: ["*.sh"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vovoscan.audio-tests
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
